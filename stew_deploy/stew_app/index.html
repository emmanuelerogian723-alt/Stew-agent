<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stew — AI Superpowers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0d0b1a; --bg2:#141126; --card:#1a1730; --card2:#211d3d;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f2f0fb; --mut:#9b95b8;
  --vio:#7c5cff; --org:#ff8c42; --grad:linear-gradient(135deg,#7c5cff,#ff8c42);
  --ok:#34d399;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 30% at 15% 0%,rgba(124,92,255,.18),transparent 70%),
             radial-gradient(50% 30% at 90% 100%,rgba(255,140,66,.12),transparent 70%);}
input,textarea,button{font:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}
img{display:block}
::-webkit-scrollbar{width:0;height:0}

/* ── animations ─────────────────────────── */
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,86,86,.45)}50%{box-shadow:0 0 0 14px rgba(245,86,86,0)}}
@keyframes blink{50%{opacity:.15}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ── header ─────────────────────────────── */
header{
  position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
  background:rgba(13,11,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.ico-btn{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--mut);transition:transform .15s,background .2s;flex:none;
}
.ico-btn:active{transform:scale(.86);background:rgba(255,255,255,.09)}
.h-title{flex:1;min-width:0;text-align:center;cursor:pointer}
.h-title b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title span{font-size:11px;color:var(--mut)}
.h-title:active{opacity:.7}
.speak-on{color:var(--org) !important}

/* ── drawer ──────────────────────────────── */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .28s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:50;width:82%;max-width:320px;
  background:var(--bg2);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;padding:calc(var(--safe-t) + 14px) 14px 14px;
}
#drawer.on{transform:none}
.d-brand{display:flex;align-items:center;gap:10px;padding:4px 4px 14px}
.d-brand .logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.d-brand b{font-size:16px}
.d-brand span{font-size:11px;color:var(--mut);display:block}
.new-btn{
  width:100%;padding:12px;border-radius:14px;background:var(--grad);font-weight:700;font-size:14px;
  color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s;box-shadow:0 6px 22px -8px rgba(124,92,255,.55);
}
.new-btn:active{transform:scale(.96)}
.d-search{
  margin:12px 0 8px;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--mut);font-size:13px;
}
.d-search input{flex:1;color:var(--text);font-size:13px}
.d-label{font-size:10.5px;letter-spacing:.14em;color:var(--mut);font-weight:700;padding:10px 4px 6px}
#chatlist{flex:1;overflow-y:auto;overscroll-behavior:contain}
.chat-item{
  display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;margin-bottom:2px;
  font-size:13.5px;color:var(--text);animation:pop .25s both;cursor:pointer;transition:background .15s;
}
.chat-item:active,.chat-item.sel{background:var(--card2)}
.chat-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .x{color:var(--mut);font-size:13px;padding:4px 6px;border-radius:8px}
.chat-item .x:active{color:#f87171}
.d-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.d-row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;font-size:13.5px;color:var(--text);text-decoration:none;transition:background .15s}
.d-row:active{background:var(--card2)}
.d-row i{font-style:normal;font-size:16px;width:22px;text-align:center}
.d-row small{margin-left:auto;color:var(--mut);font-size:10.5px}

/* ── chat area ──────────────────────────── */
#chatwrap{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 4px;scroll-behavior:smooth}
.welcome{margin:auto;text-align:center;padding:20px 10px;animation:pop .5s}
.welcome .face{width:92px;height:92px;margin:0 auto 16px;border-radius:26px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 18px 50px -12px rgba(124,92,255,.6);animation:pop .55s both}
.welcome h2{font-size:21px;margin-bottom:7px}
.welcome p{color:var(--mut);font-size:13px;line-height:1.5;max-width:300px;margin:0 auto}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px;padding:0 6px}
.sugg button{
  background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 10px;
  font-size:12.5px;color:var(--text);text-align:left;line-height:1.35;
  transition:transform .15s,border-color .2s;animation:pop .45s both;
}
.sugg button:nth-child(2){animation-delay:.06s}.sugg button:nth-child(3){animation-delay:.12s}.sugg button:nth-child(4){animation-delay:.18s}
.sugg button:active{transform:scale(.95);border-color:var(--vio)}

.msg{display:flex;gap:9px;margin-bottom:16px;animation:pop .3s both;max-width:100%}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:2px}
.msg.stew .av{background:var(--grad)}
.msg.me .av{background:var(--card2);font-size:14px}
.bubblewrap{max-width:82%;min-width:0}
.msg.me .bubblewrap{display:flex;flex-direction:column;align-items:flex-end}
.bubble{
  padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;
  word-wrap:break-word;overflow-wrap:break-word;
}
.msg.me .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.stew .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble img{border-radius:14px;max-width:240px;margin-bottom:6px}
.bubble a{color:#a78bfa;text-decoration:underline;word-break:break-all}
.bubble code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:6px;font-family:ui-monospace,monospace;font-size:13px}
.bubble pre{background:#0a0817;border:1px solid var(--line);border-radius:12px;padding:11px;overflow-x:auto;margin:7px 0;white-space:pre}
.bubble pre code{background:none;padding:0}
.caret{display:inline-block;width:8px;height:15px;background:var(--vio);border-radius:2px;vertical-align:-2px;animation:blink .9s infinite;margin-left:2px}
.atts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:5px}
.att-chip{background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:4px 9px;font-size:11px;display:flex;gap:5px;align-items:center}
.voice-b{display:flex;align-items:center;gap:9px;background:rgba(124,92,255,.16);border:1px solid rgba(124,92,255,.35);border-radius:14px;padding:9px 12px;margin-bottom:5px}
.play-b{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.voice-b .bars{display:flex;gap:2.5px;align-items:center;height:20px}
.voice-b .bars i{width:3px;height:12px;border-radius:2px;background:var(--vio);animation:bar 1s infinite}
.voice-b .dur{font-size:11px;color:var(--mut)}
.acts{display:flex;gap:4px;margin-top:6px;opacity:.75}
.act{font-size:11.5px;color:var(--mut);padding:4px 8px;border-radius:9px;transition:background .15s}
.act:active{background:var(--card2);color:var(--text)}
.thinking{display:inline-flex;gap:4px;padding:4px 0}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--vio);animation:blink 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}

.mission-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:16px;animation:pop .3s both;max-width:82%}
.mission-card .st{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.mission-card .st .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--vio);animation:spin .8s linear infinite;flex:none}
.m-tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.m-tools span{font-size:10.5px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;animation:pop .3s both}
.dlv{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.dlv a{font-size:12px;background:rgba(52,211,153,.13);border:1px solid rgba(52,211,153,.4);color:var(--ok);border-radius:10px;padding:7px 11px;text-decoration:none;font-weight:600}
.prog{height:4px;background:var(--card2);border-radius:4px;margin-top:10px;overflow:hidden;position:relative}
.prog i{position:absolute;top:0;bottom:0;width:35%;background:var(--grad);border-radius:4px;animation:slideL 1.6s infinite}

/* ── tools row + composer ───────────────── */
#dock{padding:6px 12px calc(var(--safe-b) + 8px);background:rgba(13,11,26,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tools{display:flex;gap:6px;padding:7px 2px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;
  flex:none;transition:all .2s;
}
.chip:active{transform:scale(.93)}
.chip.on{color:#fff;border-color:var(--vio);background:rgba(124,92,255,.22);box-shadow:0 0 16px -4px rgba(124,92,255,.5)}
.composer{
  display:flex;align-items:flex-end;gap:7px;background:var(--card);
  border:1px solid var(--line2);border-radius:26px;padding:7px;
  transition:border-color .25s,box-shadow .25s;
}
.composer.focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(124,92,255,.14)}
.composer.rec{border-color:#f55656;box-shadow:0 0 0 3px rgba(245,86,86,.18)}
#input{
  flex:1;resize:none;max-height:110px;min-height:24px;line-height:1.45;font-size:14.5px;
  padding:9px 4px;background:none;color:var(--text);
}
#input::placeholder{color:#6b6489}
#send-btn{
  width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:none;
  transition:transform .15s;box-shadow:0 4px 14px -4px rgba(124,92,255,.6);
}
#send-btn:active{transform:scale(.85)}
#send-btn:disabled{opacity:.45;transform:none}
#mic-btn{flex:none;transition:transform .15s}
#mic-btn.rec{color:#f55656;animation:pulse 1.2s infinite}
.attach-prev{display:flex;gap:8px;padding:8px 2px 0}
.attach-prev .p{position:relative;animation:pop .25s both}
.attach-prev img{width:56px;height:56px;object-fit:cover;border-radius:13px;border:1px solid var(--line2)}
.attach-prev .doc{background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:9px 12px;font-size:12px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach-prev .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#f55656;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.rec-ind{display:none;align-items:center;gap:9px;padding:9px 4px 0;font-size:12.5px;color:#f87171;animation:fadein .2s}
.rec-ind.on{display:flex}
.rec-ind .dot{width:9px;height:9px;border-radius:50%;background:#f55656;animation:blink 1s infinite}

/* ── sheets ── */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:76%;background:var(--bg2);
  border-radius:24px 24px 0 0;border-top:1px solid var(--line2);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;padding-bottom:var(--safe-b);
}
#sheet.on{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sh-head b{font-size:16px}
.sh-grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:10px auto 0}
#sheet-scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .28s}
#sheet-scrim.on{opacity:1;pointer-events:auto}
.sh-body{overflow-y:auto;overscroll-behavior:contain;padding:6px 14px 18px}
.sh-search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:13px;color:var(--mut)}
.sh-search input{flex:1;color:var(--text)}
.p-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;margin-bottom:3px;transition:background .15s;cursor:pointer;animation:pop .25s both}
.p-row:active{background:var(--card2)}
.p-row.sel{background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.35)}
.p-row .ico{width:40px;height:40px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.p-row b{font-size:14px;display:block}
.p-row small{color:var(--mut);font-size:11.5px;line-height:1.35;display:block}
.p-row .ck{margin-left:auto;color:var(--vio);font-size:15px;flex:none}
.skill-row{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:14px;margin-bottom:3px;transition:background .15s;cursor:pointer;animation:pop .22s both}
.skill-row:active{background:var(--card2)}
.skill-row b{font-size:13.5px;font-family:ui-monospace,monospace}
.skill-row small{color:var(--mut);font-size:11.5px;display:block;line-height:1.35}
.skill-row .cat{font-size:9.5px;background:rgba(124,92,255,.16);color:#b7a5ff;border-radius:7px;padding:2px 7px;flex:none;margin-left:auto}
.set-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;animation:pop .25s both}
.set-card b{font-size:13.5px;display:block;margin-bottom:4px}
.set-card small{color:var(--mut);font-size:11.5px;line-height:1.45;display:block}
.set-card input{width:100%;margin-top:9px;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--text)}
.set-btn{display:inline-block;margin-top:10px;background:var(--grad);border-radius:11px;padding:9px 16px;font-size:12.5px;font-weight:700;color:#fff;text-decoration:none}

/* ── toast ──────────────────────────────── */
#toast{
  position:fixed;top:calc(var(--safe-t) + 14px);left:50%;transform:translateX(-50%);z-index:99;
  background:#26224a;border:1px solid var(--line2);border-radius:14px;padding:10px 16px;
  font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .25s both;max-width:88%;
  transition:opacity .4s,transform .4s;white-space:pre-wrap;text-align:center;
}
#toast.off{opacity:0;transform:translate(-50%,-8px)}

/* ── splash ─────────────────────────────── */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s,visibility .5s}
#splash.off{opacity:0;visibility:hidden}
#splash .face{width:84px;height:84px;border-radius:24px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:42px;animation:pop .5s both}
#splash b{font-size:17px}
#splash span{font-size:11.5px;color:var(--mut)}

@media (min-width:700px){
  #chatwrap{max-width:860px;margin:0 auto;width:100%}
  #dock{max-width:860px;margin:0 auto;width:100%;border-radius:26px 26px 0 0}
  .bubblewrap{max-width:70%}
}
</style>
</head>
<body>

<div id="splash"><div class="face">🍲</div><b>Stew</b><span>AI Superpowers — Built for Africa 🌍</span></div>

<header>
  <button class="ico-btn" onclick="toggleDrawer(true)" aria-label="Menu">☰</button>
  <div class="h-title" onclick="openSheet('personas')">
    <b id="h-persona">🤖 General Assistant</b>
    <span>Stew · tap to switch persona</span>
  </div>
  <button class="ico-btn" id="auto-speak-btn" onclick="toggleAutoSpeak()" aria-label="Auto read">🔊</button>
</header>

<div id="scrim" onclick="toggleDrawer(false)"></div>
<aside id="drawer">
  <div class="d-brand">
    <div class="logo">🍲</div>
    <div><b>Stew</b><span>Smart Thinking Executive Worker</span></div>
  </div>
  <button class="new-btn" onclick="newChat()">✚ New chat</button>
  <div class="d-search">🔎<input id="find" placeholder="Search chats..." oninput="renderChatList()"></div>
  <div class="d-label">CHATS</div>
  <div id="chatlist"></div>
  <div class="d-foot">
    <div class="d-row" onclick="openSheet('skills')"><i>🧰</i>Skills<small>63 live</small></div>
    <div class="d-row" onclick="openSheet('settings')"><i>⚙️</i>Settings</div>
    <a class="d-row" href="/app/StewAgent.apk" download="StewAgent.apk"><i>🤖</i>Android APK<small>2.5MB</small></a>
    <div class="d-row" onclick="showAbout()"><i>ℹ️</i>About Stew</div>
  </div>
</aside>

<main id="chatwrap"><div id="chat"></div></main>

<div id="dock">
  <div class="tools">
    <button class="chip" id="c-web" onclick="toggleTool('web')">🌐 Web search</button>
    <button class="chip" id="c-img" onclick="toggleTool('img')">🎨 Image</button>
    <button class="chip" id="c-mission" onclick="toggleTool('mission')">🚀 Mission</button>
    <button class="chip" onclick="openSheet('skills')">🧰 Skills</button>
    <button class="chip" onclick="openSheet('personas')">🎭 Persona</button>
  </div>
  <div class="rec-ind" id="rec-ind"><span class="dot"></span><span id="rec-time">0:00</span>&nbsp;— recording voice note… tap 🎤 to send</div>
  <div class="attach-prev" id="attach-prev"></div>
  <div class="composer" id="composer">
    <button class="ico-btn" onclick="pickAttach()" aria-label="Attach">📎</button>
    <textarea id="input" rows="1" placeholder="Message Stew..." oninput="autoGrow(this)" onfocus="document.getElementById('composer').classList.add('focus')" onblur="document.getElementById('composer').classList.remove('focus')"></textarea>
    <button class="ico-btn" id="mic-btn" onclick="micTap()" aria-label="Voice">🎤</button>
    <button id="send-btn" onclick="send()" aria-label="Send">➤</button>
  </div>
</div>

<div id="sheet-scrim" onclick="closeSheet()"></div>
<div id="sheet">
  <div class="sh-grab"></div>
  <div class="sh-head"><b id="sh-title">Personas</b><button class="ico-btn" onclick="closeSheet()">✕</button></div>
  <div class="sh-body" id="sh-body"></div>
</div>

<div id="toast" class="off"></div>

<script>
/* ═══ Stew — single-chat AI app v2.0 ═══ */
const API = location.origin;
const DEFAULT_KEY = "stew_O9X6d0rXTR3OGcQEJ1F3XXgFKLAuxEYNwytqo0mdmLFE2sXBQC0chbjP8b2";
let KEY = localStorage.getItem("stew_key") || DEFAULT_KEY;
let PERSONA = localStorage.getItem("stew_persona") || "General Assistant";
let AUTO_SPEAK = localStorage.getItem("stew_autospeak") === "1";
let TOOLS = {web:false, img:false, mission:false};
let BUSY = false, CHAT = [], CONVS = [], CUR = null;
let ATTACH = null;
let REC = null;
let PERSONAS = [], SKILLS = [];
const VOICES = {};
const $ = id => document.getElementById(id);

/* ── boot ───────────────────────────────── */
setTimeout(() => $("splash").classList.add("off"), 900);
loadConvs();
if (CUR && CHAT.length){ renderChat(); } else { renderWelcome(); }
renderChatList();
boot();

async function boot(){
  if (AUTO_SPEAK) $("auto-speak-btn").classList.add("speak-on");
  try{
    const [p, s] = await Promise.all([
      fetch(API + "/personas").then(r => r.json()),
      fetch(API + "/skills").then(r => r.json())
    ]);
    PERSONAS = (Array.isArray(p) ? p : p.personas || []).map(x =>
      typeof x === "string" ? {name:x, desc:"", icon:"🎭"} : {name: x.label || x.name || x.id || "Assistant", desc: x.desc || "", icon: x.icon || "🎭", id: x.id});
    SKILLS = Array.isArray(s) ? s : s.skills || [];
  }catch(e){}
  $("h-persona").textContent = "🤖 " + PERSONA;
}

/* ── conversations ────────── */
function loadConvs(){
  try{ CONVS = JSON.parse(localStorage.getItem("stew_convs") || "[]"); }catch(e){ CONVS = []; }
  CUR = localStorage.getItem("stew_cur") || null;
  const c = CONVS.find(x => x.id === CUR);
  if (c) CHAT = c.messages || [];
}
function saveConv(){
  if (!CHAT.length) return;
  if (!CUR){ CUR = "c" + Date.now(); CONVS.unshift({id:CUR, title:"New chat", messages:CHAT, at:Date.now()}); }
  const c = CONVS.find(x => x.id === CUR);
  c.messages = CHAT;
  if (c.title === "New chat"){
    const first = CHAT.find(m => m.role === "user");
    c.title = first ? msgText(first).slice(0, 46) : "New chat";
  }
  localStorage.setItem("stew_convs", JSON.stringify(CONVS));
  localStorage.setItem("stew_cur", CUR);
  renderChatList();
}
function msgText(m){
  const parts = m.parts || [{type:"text", text:m.content}];
  return parts.filter(p => p.type === "text").map(p => p.text).join(" ");
}
function renderChatList(){
  const q = ($("find").value || "").toLowerCase();
  $("chatlist").innerHTML = CONVS
    .filter(c => !q || c.title.toLowerCase().includes(q))
    .map(c => `<div class="chat-item ${c.id === CUR ? "sel" : ""}" onclick="openConv('${c.id}')"><span>💬</span><span class="t">${esc(c.title)}</span><span class="x" onclick="delConv(event,'${c.id}')">🗑</span></div>`)
    .join("") || `<div style="padding:18px 8px;color:var(--mut);font-size:12.5px;text-align:center">No chats yet — start one ✨</div>`;
}
function openConv(id){
  const c = CONVS.find(x => x.id === id); if (!c) return;
  CUR = id; CHAT = c.messages;
  localStorage.setItem("stew_cur", CUR);
  toggleDrawer(false); renderChat(); renderChatList();
}
function delConv(ev, id){
  ev.stopPropagation();
  CONVS = CONVS.filter(c => c.id !== id);
  localStorage.setItem("stew_convs", JSON.stringify(CONVS));
  if (CUR === id){ CUR = null; CHAT = []; renderWelcome(); }
  renderChatList();
}
function newChat(){
  CUR = null; CHAT = []; ATTACH = null; renderAttach();
  localStorage.removeItem("stew_cur");
  toggleDrawer(false); renderWelcome();
}
function toggleDrawer(on){ $("drawer").classList.toggle("on", on); $("scrim").classList.toggle("on", on); }

/* ── chat render ─────────────────────────── */
function renderWelcome(){
  $("chat").innerHTML = `
  <div class="welcome">
    <div class="face">🍲</div>
    <h2>Hey! I'm Stew</h2>
    <p>Chat, send photos &amp; voice notes, generate images, search the live web — or launch a full mission. All in one place.</p>
    <div class="sugg">
      <button onclick="quick('Write me a business plan for a POS agency in Enugu')">💼 Business plan for my POS agency</button>
      <button onclick="quick('Generate an image of a Lagos sunset in anime style')">🎨 Image of a Lagos sunset</button>
      <button onclick="quick('What are the top fintech news in Nigeria this week?')">🌍 Top fintech news in Nigeria</button>
      <button onclick="quick('Explain Bitcoin like I am 10')">🧠 Explain Bitcoin like I'm 10</button>
    </div>
  </div>`;
}
function renderChat(){
  if (!CHAT.length){ renderWelcome(); return; }
  $("chat").innerHTML = "";
  CHAT.forEach(m => {
    if (m.mission){
      const div = document.createElement("div");
      div.innerHTML = m.mission;
      const card = div.querySelector(".mission-card");
      if (card){ card.style.animation = "none"; $("chat").appendChild(card); }
      return;
    }
    const el = renderMsg(m.role, m.parts || [{type:"text", text:m.content}]);
    el.style.animation = "none";
    $("chat").appendChild(el);
  });
  scrollDown(false);
}
function quick(t){ $("input").value = t; autoGrow($("input")); send(); }

function renderMsg(role, parts){
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "me" : "stew");
  const av = role === "user" ? "🧑" : "🍲";
  const textParts = parts.filter(p => p.type === "text").map(p => p.text).join("\n");
  let inner = "";
  if (role === "user"){
    let atts = "";
    for (const p of parts){
      if (p.type === "image") atts += `<img src="${p.dataUrl}" alt="attachment">`;
      if (p.type === "doc") atts += `<div class="att-chip">📄 ${esc(p.name)}</div>`;
      if (p.type === "voice") atts += `<div class="voice-b"><button class="play-b" onclick="playVoice('${p.audioId}')">▶</button><div class="bars"><i></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.45s"></i></div><span class="dur">${p.dur}s</span></div>`;
    }
    inner = `<div style="display:flex;flex-direction:column;align-items:flex-end;max-width:100%">${atts}<div class="bubble">${esc(textParts)}</div></div>`;
  } else {
    inner = `<div class="bubble">${md(textParts)}</div>
      <div class="acts">
        <button class="act" onclick="copyMsg(this)">📋 Copy</button>
        <button class="act" onclick="speak(this)">🔊 Read aloud</button>
        <button class="act" onclick="regen()">🔁 Regenerate</button>
      </div>`;
  }
  div.innerHTML = `<div class="av">${av}</div><div class="bubblewrap">${inner}</div>`;
  return div;
}
function pushMsg(role, parts){
  if ($("chat").querySelector(".welcome")) $("chat").innerHTML = "";
  const el = renderMsg(role, parts);
  $("chat").appendChild(el);
  scrollDown();
  return el;
}
function scrollDown(smooth = true){
  const c = $("chat");
  c.scrollTo({top: c.scrollHeight, behavior: smooth ? "smooth" : "auto"});
}

/* ── send ───────── */
async function send(){
  const text = $("input").value.trim();
  if (!text && !ATTACH){ return; }
  if (BUSY){ toast("Stew is still working…"); return; }
  const parts = [];
  if (ATTACH){
    if (ATTACH.kind === "image") parts.push({type:"image", dataUrl:ATTACH.dataUrl});
    else parts.push({type:"doc", name:ATTACH.name, text:ATTACH.text});
    ATTACH = null; renderAttach();
  }
  if (text) parts.push({type:"text", text});

  $("input").value = ""; autoGrow($("input"));
  pushMsg("user", parts);
  CHAT.push({role:"user", parts});
  saveConv();
  haptic(12);

  if (TOOLS.mission && text){ runMission(text); return; }
  if (TOOLS.img && text){ runImage(text); return; }
  await streamChat(parts);
}

async function streamChat(parts){
  BUSY = true; $("send-btn").disabled = true;
  const el = pushMsg("stew", [{type:"text", text:""}]);
  const bubble = el.querySelector(".bubble");
  bubble.innerHTML = `<span class="thinking"><i></i><i></i><i></i></span>`;
  let acc = "";
  try{
    const apiParts = parts.map(p =>
      p.type === "image" ? {type:"image_url", image_url:{url:p.dataUrl}} :
      p.type === "doc" ? {type:"text", text:`(Attached document: ${p.name})\n${(p.text || "").slice(0, 6000)}`} :
      {type:"text", text:p.text}
    );
    const lastUser = apiParts.length === 1 && apiParts[0].type === "text" ? apiParts[0].text : apiParts;
    const hist = CHAT.slice(0, -1).slice(-12).map(m => ({role:m.role, content: msgText(m)}));
    const body = {
      model: "stew-agent",
      messages: [
        {role:"system", content:`You are Stew, a brilliant friendly AI assistant for Africans. Current persona: ${PERSONA}. Be concise, warm, use emoji naturally. Today: ${new Date().toDateString()}.`},
        ...hist,
        {role:"user", content: lastUser}
      ],
      stream: true,
      web_search: TOOLS.web
    };
    const resp = await fetch(API + "/v1/chat/completions", {
      method: "POST",
      headers: {"Content-Type":"application/json", "Authorization":"Bearer " + KEY},
      body: JSON.stringify(body)
    });
    if (!resp.ok){ throw new Error((await resp.text()).slice(0, 160)); }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines){
        const s = line.trim();
        if (!s.startsWith("data:")) continue;
        const payload = s.slice(5).trim();
        if (payload === "[DONE]") continue;
        try{
          const j = JSON.parse(payload);
          const delta = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || "";
          if (delta){
            acc += delta;
            bubble.innerHTML = md(acc) + `<span class="caret"></span>`;
            scrollDown();
          }
        }catch(_){}
      }
    }
    if (!acc) acc = "…";
    bubble.innerHTML = md(acc);
    CHAT.push({role:"assistant", parts:[{type:"text", text:acc}]});
    saveConv();
    if (AUTO_SPEAK) speak(el.querySelector(".acts .act:nth-child(2)"));
  }catch(e){
    bubble.innerHTML = `⚠️ ${esc(String(e.message || e)).slice(0, 180)}`;
  }
  BUSY = false; $("send-btn").disabled = false;
  haptic(18);
}

function regen(){
  if (BUSY) return;
  for (let i = CHAT.length - 1; i >= 0; i--){
    if (CHAT[i].role === "assistant"){ CHAT.splice(i, 1); break; }
  }
  const lastUser = [...CHAT].reverse().find(m => m.role === "user");
  if (!lastUser){ toast("Nothing to regenerate"); return; }
  renderChat();
  streamChat(lastUser.parts);
}

/* ── image mode ──────────────────────────── */
async function runImage(prompt){
  BUSY = true; $("send-btn").disabled = true;
  const el = pushMsg("stew", [{type:"text", text:""}]);
  el.querySelector(".bubble").innerHTML = `🎨 Painting “${esc(prompt)}”…<span class="thinking"><i></i><i></i><i></i></span>`;
  try{
    const r = await fetch(API + "/generate/image", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({prompt, width:1024, height:1024, api_key: KEY})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Generation failed");
    const src = d.image_data || d.image_url || (d.base64 ? "data:image/png;base64," + d.base64 : null);
    if (!src) throw new Error("No image returned");
    el.querySelector(".bubble").innerHTML = `<img src="${src}" alt="${esc(prompt)}"><b>✨ ${esc(prompt)}</b>`;
    CHAT.push({role:"assistant", parts:[{type:"text", text:"🎨 Image generated: " + prompt}]});
    saveConv(); haptic(20);
  }catch(e){
    el.querySelector(".bubble").innerHTML = `⚠️ ${esc(e.message)}`;
  }
  BUSY = false; $("send-btn").disabled = false;
}

/* ── mission mode ────────────────────────── */
async function runMission(goal){
  BUSY = true; $("send-btn").disabled = true;
  const card = document.createElement("div");
  card.className = "mission-card";
  card.innerHTML = `<div class="st"><span class="spin"></span><span id="mc-stage">🚀 Launching mission…</span></div>
    <div class="prog"><i></i></div><div class="m-tools" id="mc-tools"></div><div class="dlv" id="mc-dlv"></div>`;
  if ($("chat").querySelector(".welcome")) $("chat").innerHTML = "";
  $("chat").appendChild(card); scrollDown();
  const t0 = Date.now();
  let done = false;
  const stages = ["🧠 Understanding the goal…", "🔬 Researching…", "🛠️ Building…", "✨ Polishing deliverables…"];
  let si = 0;
  const stageT = setInterval(() => {
    const st = card.querySelector("#mc-stage");
    if (st) st.textContent = stages[(si++) % stages.length];
  }, 4000);
  try{
    const r = await fetch(API + "/agent/run", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({goal, api_key: KEY})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Launch failed");
    while (!done){
      await new Promise(res => setTimeout(res, 2500));
      const s = await (await fetch(API + "/agent/status/" + d.job_id + "?api_key=" + encodeURIComponent(KEY))).json();
      const tools = (s.tools_used || []).map(t => t.replace(/_/g, " "));
      const tw = card.querySelector("#mc-tools");
      if (tw && tools.length) tw.innerHTML = tools.map(t => `<span>🔧 ${esc(t)}</span>`).join("");
      if (s.status === "done" || s.status === "error"){
        done = true; clearInterval(stageT);
        if (s.status === "error") throw new Error(s.error || "Mission failed");
        const secs = Math.round((Date.now() - t0) / 1000);
        card.querySelector(".st").innerHTML = `✅ Mission complete in ${secs}s`;
        const bar = card.querySelector(".prog");
        if (bar) bar.innerHTML = `<i style="width:100%;animation:none"></i>`;
        let dlvHtml = "";
        (s.deliverables || []).forEach(x => {
          if (x.base64){
            const mime = {pdf:"application/pdf", docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
              xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation"}[x.type || x.format] || "application/octet-stream";
            dlvHtml += `<a href="data:${mime};base64,${x.base64}" download="${esc(x.name || ("deliverable." + (x.type || x.format || "bin")))}">⬇ ${esc((x.name || "deliverable").slice(0, 28))}</a>`;
          }
        });
        const dl = card.querySelector("#mc-dlv");
        if (dl) dl.innerHTML = dlvHtml;
        CHAT.push({role:"assistant", mission: card.outerHTML});
        const text = s.response || "Mission complete 🎉";
        CHAT.push({role:"assistant", parts:[{type:"text", text}]});
        saveConv();
        const el = pushMsg("stew", [{type:"text", text}]);
        el.style.animation = "none";
        haptic([25, 40, 25]); chime();
      }
    }
  }catch(e){
    done = true; clearInterval(stageT);
    const st = card.querySelector(".st");
    if (st) st.innerHTML = `⚠️ ${esc(e.message).slice(0, 120)}`;
    const sp = card.querySelector(".spin");
    if (sp) sp.remove();
  }
  BUSY = false; $("send-btn").disabled = false;
}

/* ── attachments ─────────────────────────── */
function pickAttach(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*,application/pdf,.txt,.md,.csv,.json,.docx";
  inp.onchange = () => { if (inp.files[0]) handleFile(inp.files[0]); };
  inp.click();
}
async function handleFile(f){
  haptic(10);
  if (f.type.startsWith("image/")){
    const dataUrl = await fileToDataUrl(f);
    ATTACH = {kind:"image", dataUrl, name:f.name};
  } else {
    let text = "";
    try{ text = await f.text(); }catch(e){}
    ATTACH = {kind:"doc", name:f.name, text: text || "(binary file — could not extract text)"};
  }
  renderAttach();
}
function fileToDataUrl(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}
function renderAttach(){
  const p = $("attach-prev");
  if (!ATTACH){ p.innerHTML = ""; return; }
  p.innerHTML = ATTACH.kind === "image"
    ? `<div class="p"><img src="${ATTACH.dataUrl}"><button class="rm" onclick="ATTACH=null;renderAttach()">✕</button></div>`
    : `<div class="p"><div class="doc">📄 ${esc(ATTACH.name)}</div><button class="rm" onclick="ATTACH=null;renderAttach()">✕</button></div>`;
}
function autoGrow(t){ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 110) + "px"; }

/* ── voice notes ───────────────────────────────── */
function micTap(){
  if (REC){ stopRec(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast("🎤 Voice not supported on this browser"); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
    const mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
    const chunks = [];
    mr.ondataavailable = e => chunks.push(e.data);
    const t0 = Date.now();
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type: mr.mimeType || "audio/webm"});
      const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
      const vid = "v" + t0;
      VOICES[vid] = URL.createObjectURL(blob);
      const fd = new FormData();
      fd.append("file", blob, "voice." + ((mr.mimeType || "").includes("mp4") ? "mp4" : "webm"));
      const el = pushMsg("user", [{type:"voice", audioId:vid, dur:secs}, {type:"text", text:"…"}]);
      el.querySelector(".bubble").innerHTML = `<span class="thinking"><i></i><i></i><i></i></span>`;
      try{
        const r = await fetch(API + "/api/stt", {method:"POST", body:fd});
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || "Transcription failed");
        const parts = [{type:"voice", audioId:vid, dur:secs}, {type:"text", text:d.text}];
        el.remove();
        CHAT.push({role:"user", parts});
        saveConv();
        const el2 = pushMsg("user", parts);
        el2.style.animation = "none";
        await streamChat(parts);
      }catch(e){
        el.querySelector(".bubble").innerHTML = `⚠️ ${esc(e.message).slice(0, 120)}`;
      }
      REC = null;
    };
    mr.start();
    REC = {mr, timer:setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $("rec-time").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }, 300)};
    $("rec-ind").classList.add("on");
    $("mic-btn").classList.add("rec");
    $("composer").classList.add("rec");
    haptic(15);
  }).catch(() => toast("🎤 Microphone permission needed"));
}
function stopRec(){
  if (!REC) return;
  clearInterval(REC.timer);
  $("rec-ind").classList.remove("on");
  $("mic-btn").classList.remove("rec");
  $("composer").classList.remove("rec");
  haptic(25);
  REC.mr.stop();
}
function playVoice(id){
  const url = VOICES[id];
  if (url){ new Audio(url).play(); return; }
  toast("Voice replay available in this session only");
}

/* ── read aloud ────────────────────── */
function toggleAutoSpeak(){
  AUTO_SPEAK = !AUTO_SPEAK;
  localStorage.setItem("stew_autospeak", AUTO_SPEAK ? "1" : "0");
  $("auto-speak-btn").classList.toggle("speak-on", AUTO_SPEAK);
  toast(AUTO_SPEAK ? "🔊 Auto-read ON — replies will be spoken" : "🔇 Auto-read OFF");
}
async function speak(btn){
  if (!btn) return;
  const bubble = btn.closest(".bubblewrap").querySelector(".bubble");
  const text = bubble.innerText.replace(/\s+/g, " ").slice(0, 2500);
  if (!text) return;
  btn.textContent = "⏳";
  try{
    const r = await fetch(API + "/api/tts", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text})});
    const d = await r.json();
    if (!r.ok || !d.audio_base64) throw new Error("TTS failed");
    new Audio("data:audio/mp3;base64," + d.audio_base64).play();
    btn.textContent = "🔊";
  }catch(e){
    try{ speechSynthesis.speak(new SpeechSynthesisUtterance(text)); btn.textContent = "🔊"; }
    catch(_){ btn.textContent = "⚠️"; }
  }
}

/* ── sheets ──────────────────────────────── */
function openSheet(kind){
  toggleDrawer(false);
  const body = $("sh-body");
  $("sheet").classList.add("on"); $("sheet-scrim").classList.add("on");
  if (kind === "personas"){
    $("sh-title").textContent = "Personas";
    body.innerHTML = (PERSONAS.length ? PERSONAS : [{name:"General Assistant", desc:"Brilliant all-round helper"}]).map(p => `
      <div class="p-row ${p.name === PERSONA ? "sel" : ""}" onclick="setPersona('${esc(p.name)}')">
        <div class="ico">${esc(p.icon || "🎭")}</div>
        <div><b>${esc(p.name)}</b><small>${esc(p.desc || "")}</small></div>
        ${p.name === PERSONA ? "<span class='ck'>✓</span>" : ""}
      </div>`).join("");
  }
  if (kind === "skills"){
    $("sh-title").textContent = "Skills — live on Stew's engine";
    body.innerHTML = `<div class="sh-search">🔎<input id="sk-q" placeholder="Search 63 skills..." oninput="filterSkills()"></div><div id="sk-list"></div>`;
    renderSkills("");
  }
  if (kind === "settings"){
    $("sh-title").textContent = "Settings";
    body.innerHTML = `
      <div class="set-card"><b>🔑 API key</b><small>Works out of the box with the included free key. Paste your own Stew key for more credits (stew-agent.onrender.com).</small>
        <input id="set-key" type="text" value="${esc(KEY === DEFAULT_KEY ? "" : KEY)}" placeholder="Using built-in free key">
        <button class="set-btn" onclick="saveKey()">Save key</button></div>
      <div class="set-card"><b>📲 Install</b><small>Add Stew to your home screen — full screen, own icon.</small>
        <button class="set-btn" onclick="promptInstall()">Install app</button>
        <a class="set-btn" style="margin-left:8px" href="/app/StewAgent.apk" download="StewAgent.apk">Android APK</a></div>
      <div class="set-card"><b>🧹 Data</b><small>Clear all chats and settings on this device.</small>
        <button class="set-btn" style="background:#f55656" onclick="wipeAll()">Reset app</button></div>`;
  }
}
function closeSheet(){ $("sheet").classList.remove("on"); $("sheet-scrim").classList.remove("on"); }
function setPersona(name){ PERSONA = name; localStorage.setItem("stew_persona", name); $("h-persona").textContent = "🤖 " + name; closeSheet(); toast("🎭 Persona: " + name); haptic(12); }
function renderSkills(q){
  const list = SKILLS.filter(s => !q || (s.name + " " + (s.description || "") + " " + (s.category || "")).toLowerCase().includes(q));
  $("sk-list").innerHTML = list.map(s => `
    <div class="skill-row" onclick="useSkill('${esc(s.name)}')">
      <div><b>${esc(s.name)}</b><small>${esc((s.description || "").slice(0, 70))}</small></div>
      ${s.category ? `<span class="cat">${esc(s.category)}</span>` : ""}
    </div>`).join("") || `<div style="padding:16px;color:var(--mut);font-size:12.5px">No skills match.</div>`;
}
function filterSkills(){ renderSkills(($("sk-q").value || "").toLowerCase()); }
function useSkill(name){ closeSheet(); $("input").value = "Run the " + name + " skill: "; $("input").focus(); autoGrow($("input")); }
function saveKey(){
  const v = $("set-key").value.trim();
  KEY = v || DEFAULT_KEY;
  localStorage.setItem("stew_key", KEY);
  toast(v ? "🔑 Key saved" : "🔑 Back to built-in free key");
}
function wipeAll(){
  if (!confirm("Clear all chats and settings?")) return;
  localStorage.clear(); location.reload();
}

/* ── tools toggle ────────────────────────── */
function toggleTool(t){
  if (BUSY) return;
  TOOLS[t] = !TOOLS[t];
  if (TOOLS[t]){
    if (t === "mission") TOOLS.img = false;
    if (t === "img") TOOLS.mission = false;
  }
  $("c-web").classList.toggle("on", TOOLS.web);
  $("c-img").classList.toggle("on", TOOLS.img);
  $("c-mission").classList.toggle("on", TOOLS.mission);
  $("input").placeholder = TOOLS.mission ? "Describe the mission…" : TOOLS.img ? "Describe an image…" : "Message Stew...";
  haptic(10);
}

/* ── misc ────────────────────────────────── */
function esc(s){ return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function md(t){
  t = esc(t);
  t = t.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/^\w+\n/, "").trim()}</code></pre>`);
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/\*([^*\n]+)\*/g, "<i>$1</i>");
  t = t.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t;
}
function copyMsg(btn){
  const text = btn.closest(".bubblewrap").querySelector(".bubble").innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { btn.textContent = "✅ Copied"; setTimeout(() => btn.textContent = "📋 Copy", 1400); });
}
function toast(m){
  const t = $("toast");
  t.textContent = m; t.classList.remove("off");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.add("off"), 2400);
}
function haptic(p){ try{ navigator.vibrate(p); }catch(e){} }
function chime(){ try{ const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); const g = c.createGain();
  o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.08, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .5); o.start(); o.stop(c.currentTime + .5);}catch(e){} }
function promptInstall(){
  toast("📲 Browser menu → “Add to Home screen” / “Install app”");
  closeSheet();
}
function showAbout(){
  closeSheet();
  toast("🍲 Stew v2.0 — Smart Thinking Executive Worker by MUTYINT Nigeria. Chat, voice, images, missions. Built for Africa 🌍");
}

$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
let tx = null;
document.addEventListener("touchstart", e => { if (e.touches[0].clientX < 28) tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchmove", e => { if (tx !== null && e.touches[0].clientX - tx > 60){ toggleDrawer(true); tx = null; } }, {passive:true});
document.addEventListener("touchend", () => { tx = null; }, {passive:true});
window.addEventListener("load", () => {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data && e.data.type === "SW_UPDATED" && !reloaded) { reloaded = true; location.reload(); }
  });
});
</script>
