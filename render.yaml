services:
  - type: web
    name: stew-agent
    runtime: python
    buildCommand: pip install -r stew_deploy/requirements.txt
    startCommand: cd stew_deploy && uvicorn server.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./stew.db"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SAKANA_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STEW_ADMIN_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_BASE_URL
        value: "https://stew-agent.onrender.com"
    healthCheckPath: /heartbeat
    autoDeploy: true
